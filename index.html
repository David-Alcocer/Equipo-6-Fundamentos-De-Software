<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeerHive — Panel Principal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <img src="PeerHiveLogo.png" alt="Logo PeerHive">
    <h1>PeerHive</h1>
  </header>

  <main class="container fade-in">
    <h2>Bienvenido a tu panel 🐝</h2>
    <p>Has iniciado sesión exitosamente.</p>

    <section>
      <h3>Opciones disponibles:</h3>
      <ul>
        <li>📚 Ver solicitudes de asesoría</li>
        <li>🧑‍🏫 Buscar asesores disponibles</li>
        <li>🕓 Programar sesiones</li>
        <li>💬 Ver mensajes y notificaciones</li>
      </ul>
    </section>

    <button id="logoutBtn">Cerrar sesión</button>
  </main>

  <footer class="footer">
    © 2025 PeerHive — Comunidad académica de apoyo mutuo
  </footer>

  <script>
    document.getElementById("logoutBtn").addEventListener("click", () => {
      alert("Cerraste sesión correctamente.");
      window.location.href = "index.html";
    });
  </script>

</body>
</html>
