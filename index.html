<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PeerHive — Iniciar Sesión</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-bg">
  <div class="glass-container fade-in">
    <div class="logo-area">
      <img src="Imagenes/PeerHiveLogo.png" alt="PeerHive Logo" class="logo" />
      <h1>PeerHive</h1>
      <p>Conecta. Aprende. Crece.</p>
    </div>

    <form id="loginForm" class="form-area">
      <h2>Iniciar Sesión</h2>
      <input type="email" id="loginEmail" placeholder="Correo institucional (@alumnos.uady.mx)" required />
      <input type="password" id="loginPassword" placeholder="Contraseña" required />
      <button type="submit" class="btn-primary">Entrar</button>
      <p class="register-link">
        ¿No tienes cuenta?
        <a href="#" id="showRegister">Regístrate</a>
      </p>
    </form>

    <form id="registerForm" class="form-area hidden">
      <h2>Crear Cuenta</h2>
      <input type="text" id="regName" placeholder="Nombre(s)" required />
      <input type="text" id="regLastName" placeholder="Apellidos" required />
      <input type="email" id="regEmail" placeholder="Correo institucional (@alumnos.uady.mx)" required />
      <input type="password" id="regPassword" placeholder="Contraseña" required />
      <input type="date" id="regBirth" required />
      <input type="text" id="regCountry" placeholder="País de origen" required />
      <button type="submit" class="btn-primary">Registrar</button>
      <p class="register-link">
        ¿Ya tienes cuenta?
        <a href="#" id="showLogin">Inicia sesión</a>
      </p>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
